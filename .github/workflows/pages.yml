name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/soho-shred-game-lgudxl]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run supersede an in-flight one; never run two deploys at once.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Playwright is dev-only tooling for tools/shoot.mjs; the browser
      # download is dead weight for a build.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - run: npm run build

      # One-time setup: Settings -> Pages -> Source: "GitHub Actions".
      # enablement: true is kept because it makes this workflow self-sufficient
      # wherever the token is allowed to create the site; on this repo it is
      # not ("Resource not accessible by integration"), so the toggle above is
      # required once. After that this step is a no-op.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
